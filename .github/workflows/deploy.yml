# Deploy the rebuilt ForgeAlloy site to GitHub Pages.
# Replace the existing .github/workflows/deploy.yml in the site repo with this file.
# It builds the Vite app and publishes ./dist to Pages.
name: Deploy site to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          VITE_GTM_ID: ${{ vars.VITE_GTM_ID }}
          VITE_GA4_ID: ${{ vars.VITE_GA4_ID }}
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Announced only after the deploy completes, so the pages are live when the
      # crawlers arrive. Bing feeds ChatGPT's retrieval, so this is the fastest way
      # to get new content into AI answers.
      - name: Notify IndexNow
        continue-on-error: true
        run: node scripts/indexnow.mjs
